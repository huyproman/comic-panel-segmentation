[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comics_panel_extraction"
version = "0.2.0"
description = "Standalone comic panel extraction package: M1 operational inference, canonical historical post-processing, and evaluation."
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "MIT License Placeholder - Research Prototype" }
authors = [
    { name = "Comics Panel Extraction Research Team" }
]
keywords = ["comics", "panel-extraction", "u-net-plus-plus", "deep-learning", "line-segment-analysis"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "opencv-python-headless>=4.8.0",
    "scikit-learn>=1.3.0",
    "scikit-image>=0.21.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
    "jsonschema>=4.18.0",
    "tensorflow==2.16.1",
    "keras==3.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[project.scripts]
comics-panel-extraction = "comics_panel_extraction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".local_fixtures",
    ".local_artifacts",
    "__pycache__",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
markers = [
    "unit: Generic new infrastructure tests",
    "parity: Legacy behavior equivalence checks",
    "golden: Frozen historical artifact comparisons",
    "integration: Future end-to-end workflow tests",
]
